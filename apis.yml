aid: primmune-therapeutics
name: Primmune Therapeutics
description: >-
  Primmune Therapeutics is a clinical-stage biotechnology company headquartered in Carlsbad,
  California, developing systemic cancer immunotherapies designed to activate the immune system in a
  precise and controlled manner. Its lead program, PRTX007, is an orally administered, systemically
  active small-molecule agonist of toll-like receptor 7 (TLR7) engineered to activate plasmacytoid
  dendritic cells so they produce interferons, enhance antigen presentation, recruit natural killer
  cells and support cytotoxic T cell expansion, while minimizing pro-inflammatory signaling. The
  company was founded by researchers in oral small-molecule drug design and immune agonist
  pharmacology and has completed Phase 1 evaluation in healthy volunteers. Primmune operates no
  developer program and publishes no API product, SDK, or interface contract; its public web presence
  is a WordPress marketing and investor-relations site, whose only machine-readable surfaces are the
  Yoast-generated /llms.txt and WordPress's default /wp-json/ CMS endpoint.
